<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriGen - Personalized Meal Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🥗 NutriGen</h1>
        <p>Personalized Nutrition & Meal Planner</p>
    </header>


    <!-- Main Container -->
    <main>

        <!-- User Details Section -->
        <section class="card">

            <h2>Tell Us About Yourself</h2>

            <form id="mealForm">

                <!-- Age -->
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    required
                >


                <!-- Weight -->
                <label for="weight">Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    placeholder="Enter your weight"
                    required
                >


                <!-- Height -->
                <label for="height">Height (cm)</label>
                <input
                    type="number"
                    id="height"
                    name="height"
                    placeholder="Enter your height"
                    required
                >


                <!-- Goal -->
                <label for="goal">Your Goal</label>

                <select id="goal" name="goal" required>
                    <option value="">Select your goal</option>
                    <option value="weight_loss">Weight Loss</option>
                    <option value="weight_gain">Weight Gain</option>
                    <option value="maintenance">Maintain Weight</option>
                </select>


                <!-- Diet -->
                <label for="diet">Diet Preference</label>

                <select id="diet" name="diet" required>
                    <option value="">Select your diet</option>
                    <option value="vegetarian">Vegetarian</option>
                    <option value="vegan">Vegan</option>
                    <option value="non_vegetarian">Non-Vegetarian</option>
                </select>


                <!-- Allergies -->
                <label for="allergies">Allergies / Restrictions</label>

                <input
                    type="text"
                    id="allergies"
                    name="allergies"
                    placeholder="Example: peanuts, dairy"
                >


                <!-- Target Calories -->
                <label for="calories">Daily Calorie Target</label>

                <input
                    type="number"
                    id="calories"
                    name="calories"
                    placeholder="Example: 2000"
                    required
                >


                <!-- Number of Meals -->
                <label for="meals">Number of Meals</label>

                <select id="meals" name="meals" required>
                    <option value="3">3 Meals</option>
                    <option value="4">4 Meals</option>
                    <option value="5">5 Meals</option>
                </select>


                <!-- Submit Button -->
                <button type="submit">
                    Generate Meal Plan
                </button>

            </form>

        </section>


        <!-- Meal Plan Section -->
        <section class="card" id="resultSection">

            <h2>Your Personalized Meal Plan</h2>

            <div id="mealPlan">

                <p class="placeholder">
                    Your meal plan will appear here.
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
